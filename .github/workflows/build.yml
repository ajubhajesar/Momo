name: Build

on:
  push:
    branches: [ "lifesupport" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Build FFmpeg + libvpx + dav1d ──────────────────────────────────
  ffmpeg:
    name: Native Build (FFmpeg + libvpx + dav1d)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch submodule hashes
        run: |
          git submodule status TMessagesProj/jni/ffmpeg > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx > libvpx_status
          git submodule status TMessagesProj/jni/dav1d  > dav1d_status

      - name: Cache FFmpeg + libvpx + dav1d
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/ffmpeg/config.h
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/dav1d/build
          key: ffmpeg-v2-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'dav1d_status', 'TMessagesProj/jni/build_ffmpeg_clang.sh', 'TMessagesProj/jni/build_libvpx_clang.sh', 'TMessagesProj/jni/build_dav1d.sh', 'TMessagesProj/jni/patches/ffmpeg/**') }}

      - name: Setup Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y yasm meson nasm

      - name: Build libvpx
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run init libs libvpx

      - name: Build dav1d + FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="\
          $PWD/TMessagesProj/jni/dav1d/build/arm64-v8a/lib/pkgconfig:\
          $PWD/TMessagesProj/jni/dav1d/build/armeabi-v7a/lib/pkgconfig:\
          $PWD/TMessagesProj/jni/dav1d/build/x86/lib/pkgconfig:\
          $PWD/TMessagesProj/jni/dav1d/build/x86_64/lib/pkgconfig:\
          $PKG_CONFIG_PATH"
          ./run init libs ffmpeg

      - name: Copy config.h into arch include dirs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd TMessagesProj/jni
          for ARCH in arm64-v8a armeabi-v7a x86 x86_64; do
            cp ffmpeg/config.h ffmpeg/build/$ARCH/include/config.h
          done

  # ── Job 2: Build BoringSSL ─────────────────────────────────────────────────
  boringssl:
    name: Native Build (BoringSSL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch submodule hash
        run: git submodule status TMessagesProj/jni/boringssl > boringssl_status

      - name: Cache BoringSSL
        id: cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Setup Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y cmake ninja-build

      - name: Build BoringSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run init libs boringssl

  # ── Job 3: Build APK ────────────────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [ ffmpeg, boringssl ]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Fetch submodule hashes
        run: |
          git submodule status TMessagesProj/jni/ffmpeg   > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx   > libvpx_status
          git submodule status TMessagesProj/jni/dav1d    > dav1d_status
          git submodule status TMessagesProj/jni/boringssl > boringssl_status

      - name: Restore FFmpeg + libvpx + dav1d cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/ffmpeg/config.h
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/dav1d/build
          key: ffmpeg-v2-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'dav1d_status', 'TMessagesProj/jni/build_ffmpeg_clang.sh', 'TMessagesProj/jni/build_libvpx_clang.sh', 'TMessagesProj/jni/build_dav1d.sh', 'TMessagesProj/jni/patches/ffmpeg/**') }}

      - name: Restore BoringSSL cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Re-apply BoringSSL patches (headers)
        run: |
          cd TMessagesProj/jni
          ./patch_boringssl.sh || true
          cd ../..

      - name: Apply FFmpeg source patches (C++ compat)
        run: |
          cd TMessagesProj/jni
          patch -N -f -d ffmpeg -p1 < patches/ffmpeg/0001-compilation-magic.patch || true
          patch -N -f -d ffmpeg -p1 < patches/ffmpeg/0001-PATCH-replace-SUINT-with-unsigned.patch || true
          sed -i 's/register int/int/g; s/register unsigned int/unsigned int/g; s/register int32_t/int32_t/g' ffmpeg/libavcodec/get_bits.h || true
          for ARCH in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d ffmpeg/build/$ARCH/include ] && cp ffmpeg/config.h ffmpeg/build/$ARCH/include/config.h || true
          done
          ./patch_ffmpeg.sh || true

      # Cache the pre-built .so in src/main/libs (populated after first build)
      # Key: only local JNI sources + submodule status (NOT submodule source trees)
      - name: Cache libtmessages.so (arm64)
        id: so-cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/src/main/libs/arm64-v8a
          key: libtmessages-arm64-v3-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt', 'TMessagesProj/jni/*.cpp', 'TMessagesProj/jni/*.c', 'TMessagesProj/jni/*.h', 'TMessagesProj/jni/tgnet/**', 'TMessagesProj/jni/voip/**', 'TMessagesProj/jni/rlottie/**', 'TMessagesProj/jni/opus/**', 'TMessagesProj/jni/sqlite/**', 'TMessagesProj/jni/exoplayer/**', 'TMessagesProj/jni/mozjpeg/**', 'TMessagesProj/jni/intro/**', 'TMessagesProj/jni/tde2e/**', 'boringssl_status', 'ffmpeg_status') }}

      - name: Set up signing
        run: |
          base64 -d TMessagesProj/release.keystore.b64 > TMessagesProj/release.keystore
          printf "KEYSTORE_PASS=devpass123\nALIAS_NAME=dev\nALIAS_PASS=devpass123\n" > signing.properties
          echo "LOCAL_PROPERTIES=$(base64 -w 0 signing.properties)" >> $GITHUB_ENV

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Build APK
        run: |
          sed -i 's/-Xmx8192M/-Xmx6144m/g; s/-XX:MaxMetaspaceSize=4096m/-XX:MaxMetaspaceSize=1024m/g' gradle.properties
          # Enable Gradle parallel execution and build cache
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.configureondemand=true' >> gradle.properties
          export LOCAL_PROPERTIES="${{ env.LOCAL_PROPERTIES }}"
          export NATIVE_TARGET=arm64-v8a
          if [ "${{ steps.so-cache.outputs.cache-hit }}" != "true" ]; then
            echo ">>> .so cache MISS — compiling native (~25 min)"
            export COMPILE_NATIVE=true
            ./gradlew TMessagesProj:assembleRelease \
              --no-daemon \
              -x lintVitalFoss \
              -x lintVitalReportFoss \
              -x lintVitalAnalyzeFoss \
              -x lintVitalAnalyzeRelease \
              -x lintVitalReportRelease \
              -x lintVitalRelease
            # Copy freshly built .so to src/main/libs so cache can save it
            SO_SRC="TMessagesProj/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/arm64-v8a"
            if [ -d "$SO_SRC" ]; then
              mkdir -p TMessagesProj/src/main/libs/arm64-v8a
              cp "$SO_SRC"/libtmessages*.so TMessagesProj/src/main/libs/arm64-v8a/
              echo ">>> Copied .so to src/main/libs for caching"
            else
              echo ">>> Warning: stripped .so not found at $SO_SRC"
              find TMessagesProj/build/intermediates -name "libtmessages*.so" 2>/dev/null | head -5
            fi
          else
            echo ">>> .so cache HIT — skipping CMake (~5 min)"
            ./gradlew TMessagesProj:assembleRelease \
              --no-daemon \
              -x lintVitalFoss \
              -x lintVitalReportFoss \
              -x lintVitalAnalyzeFoss \
              -x lintVitalAnalyzeRelease \
              -x lintVitalReportRelease \
              -x lintVitalRelease
          fi

      - name: Find APK
        run: |
          echo "All files in outputs/apk:"
          find TMessagesProj/build/outputs/apk -type f 2>/dev/null
          APK=$(find TMessagesProj/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "##[error]No APK found!"
            exit 1
          fi
          cp "$APK" Momo.apk
          echo "APK=Momo.apk" >> $GITHUB_ENV
          echo "Found: $APK"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Built from ${{ github.sha }}"
          prerelease: true
          make_latest: true
          files: ${{ env.APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
