name: Build

on:
  push:
    branches: [ "lifesupport" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Build FFmpeg + libvpx + dav1d ──────────────────────────────────
  ffmpeg:
    name: Native Build (FFmpeg + libvpx + dav1d)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch submodule hashes
        run: |
          git submodule status TMessagesProj/jni/ffmpeg > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx > libvpx_status
          git submodule status TMessagesProj/jni/dav1d  > dav1d_status

      - name: Cache FFmpeg + libvpx + dav1d
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/ffmpeg/config.h
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/dav1d/build
          key: ffmpeg-v2-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'dav1d_status', 'TMessagesProj/jni/build_ffmpeg_clang.sh', 'TMessagesProj/jni/build_libvpx_clang.sh', 'TMessagesProj/jni/build_dav1d.sh', 'TMessagesProj/jni/patches/ffmpeg/**') }}

      - name: Setup Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y yasm meson nasm

      - name: Build libvpx
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run init libs libvpx

      - name: Build dav1d + FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Set PKG_CONFIG_PATH so ffmpeg configure can find dav1d after it's built
          export PKG_CONFIG_PATH="\
          $PWD/TMessagesProj/jni/dav1d/build/arm64-v8a/lib/pkgconfig:\
          $PWD/TMessagesProj/jni/dav1d/build/armeabi-v7a/lib/pkgconfig:\
          $PWD/TMessagesProj/jni/dav1d/build/x86/lib/pkgconfig:\
          $PWD/TMessagesProj/jni/dav1d/build/x86_64/lib/pkgconfig:\
          $PKG_CONFIG_PATH"
          ./run init libs ffmpeg

      - name: Copy config.h into arch include dirs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd TMessagesProj/jni
          # patch_ffmpeg.sh is already called by bin/init/libs/ffmpeg.sh after build
          # Just copy config.h (generated by configure) into each arch include dir
          for ARCH in arm64-v8a armeabi-v7a x86 x86_64; do
            cp ffmpeg/config.h ffmpeg/build/$ARCH/include/config.h
          done

  # ── Job 2: Build BoringSSL ─────────────────────────────────────────────────
  boringssl:
    name: Native Build (BoringSSL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch submodule hash
        run: git submodule status TMessagesProj/jni/boringssl > boringssl_status

      - name: Cache BoringSSL
        id: cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Setup Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y cmake ninja-build

      - name: Build BoringSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run init libs boringssl

  # ── Job 3: Compile .so + Build APK ────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [ ffmpeg, boringssl ]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Fetch submodule hashes
        run: |
          git submodule status TMessagesProj/jni/ffmpeg   > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx   > libvpx_status
          git submodule status TMessagesProj/jni/dav1d    > dav1d_status
          git submodule status TMessagesProj/jni/boringssl > boringssl_status

      - name: Restore FFmpeg + libvpx + dav1d cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/ffmpeg/config.h
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/dav1d/build
          key: ffmpeg-v2-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'dav1d_status', 'TMessagesProj/jni/build_ffmpeg_clang.sh', 'TMessagesProj/jni/build_libvpx_clang.sh', 'TMessagesProj/jni/build_dav1d.sh', 'TMessagesProj/jni/patches/ffmpeg/**') }}

      - name: Restore BoringSSL cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Re-apply BoringSSL patches (headers)
        run: |
          cd TMessagesProj/jni
          ./patch_boringssl.sh || true
          cd ../..

      - name: Apply FFmpeg source patches (C++ compat)
        run: |
          cd TMessagesProj/jni
          # -N = skip if already applied (safe to run even if partially patched)
          patch -N -f -d ffmpeg -p1 < patches/ffmpeg/0001-compilation-magic.patch || true
          patch -N -f -d ffmpeg -p1 < patches/ffmpeg/0001-PATCH-replace-SUINT-with-unsigned.patch || true
          # remove 'register' keyword via sed (patch has line number mismatch)
          sed -i 's/register int/int/g; s/register unsigned int/unsigned int/g; s/register int32_t/int32_t/g' ffmpeg/libavcodec/get_bits.h || true
          # config.h is restored from cache - copy into arch include dirs
          for ARCH in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d ffmpeg/build/$ARCH/include ] && cp ffmpeg/config.h ffmpeg/build/$ARCH/include/config.h || true
          done
          # Copy patched internal headers into build include dirs
          ./patch_ffmpeg.sh || true

      - name: Set up signing
        run: |
          printf "KEYSTORE_PASS=android\nALIAS_NAME=androidkey\nALIAS_PASS=android\n" > signing.properties
          echo "LOCAL_PROPERTIES=$(base64 -w 0 signing.properties)" >> $GITHUB_ENV

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Build APK
        run: |
          # Reduce JVM heap so R8 doesn't OOM the runner (7GB total available)
          sed -i 's/-Xmx8192M/-Xmx4096m/g; s/-XX:MaxMetaspaceSize=4096m/-XX:MaxMetaspaceSize=512m/g' gradle.properties
          export LOCAL_PROPERTIES="${{ env.LOCAL_PROPERTIES }}"
          export COMPILE_NATIVE=true
          export NATIVE_TARGET=arm64-v8a
          ./gradlew TMessagesProj:assembleFoss \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon \
            -x lintVitalFoss \
            -x lintVitalReportFoss \
            -x lintVitalAnalyzeFoss

      - name: Find APK
        run: |
          echo "All APKs found:"
          find TMessagesProj/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APKs found"
          APK=$(find TMessagesProj/build/outputs/apk -name "*.apk" | grep -iv "unsigned\|unaligned" | head -1)
          [ -z "$APK" ] && APK=$(find TMessagesProj/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          echo "Found: $APK"

      - name: Delete existing release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Built from ${{ github.sha }}"
          prerelease: true
          files: ${{ env.APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
